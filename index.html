<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the Metropolitan Museum of Art collection: discover one artwork at a time and read the museum's own record of it."
    />
    <title>Met Museum Explorer</title>
    <!-- Every screen reads the museum's API and shows its pictures, so the two
         connections are opened while the application is still loading. The
         API is called with fetch, which is a CORS request, hence crossorigin;
         the pictures are plain images and use the other connection pool. -->
    <link rel="preconnect" href="https://collectionapi.metmuseum.org" crossorigin />
    <link rel="preconnect" href="https://images.metmuseum.org" />
    <script>
      // Pin the saved mode on <html> before the first paint, otherwise the
      // stylesheet follows the system preference until React mounts and the
      // wrong mode flashes. Key and values mirror src/domain/themeModes.ts.
      try {
        const mode = localStorage.getItem('museum:theme-mode');

        if (mode === 'sand' || mode === 'cocoa') {
          document.documentElement.setAttribute('data-theme', mode);
        }
      } catch {
        // Storage can be blocked; the system preference then applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
