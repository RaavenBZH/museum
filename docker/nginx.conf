server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames never change contents, so they can be cached hard.
    # A single Cache-Control header: the `expires` directive would emit a second,
    # conflicting one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route: serve the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
